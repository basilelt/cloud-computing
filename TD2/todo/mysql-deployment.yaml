apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: todo
spec:
  ports:
  - port: 3306
  selector:
    app: mysql
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: todo
spec:
  selector:
    matchLabels:
      app: mysql
  strategy:
    # MySQL does not support multiple instances running at the same time,
    # so we use the Recreate strategy to ensure that only one instance is running.
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: mysql:9
        name: mysql
        resources:
          limits:
            memory: 512Mi
            cpu: "1"
          requests:
            memory: 256Mi
            cpu: "0.2"
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: todo
        - name: MYSQL_USER
          value: todo
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        # startupProbe: waits for MySQL to finish initializing before enabling other probes.
        # MySQL can be slow on first boot (DB creation, schema init).
        # Max startup time = 5 * 24 = 120s. Liveness/readiness are paused until this passes.
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p"${MYSQL_ROOT_PASSWORD}"
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
        # livenessProbe: restarts the container if MySQL stops responding.
        # Uses an exec command (not HTTP) because MySQL has no HTTP API.
        # mysqladmin ping sends a lightweight ping over TCP to localhost.
        # If MySQL hangs or crashes, this triggers a restart after 3 failures (default).
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p"${MYSQL_ROOT_PASSWORD}"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # readinessProbe: removes the pod from Service endpoints if MySQL is not ready.
        # Higher failureThreshold (6) than liveness: prefer waiting over restarting.
        # Useful during backup, high load, or transient unavailability.
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p"${MYSQL_ROOT_PASSWORD}"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pv-claim
