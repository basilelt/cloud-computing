apiVersion: v1
kind: Service
metadata:
  name: todo
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: todo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: todo
    spec:
      serviceAccountName: todo-hazelcast
      initContainers:
      - name: wait-for-mysql
        image: toschneck/wait-for-it:latest
        command:
        - /wait-for-it.sh
        - mysql:3306
        - --timeout=120
        - --strict
      containers:
      - image: registry:5000/todo:latest
        name: todo
        env:
        - name: RDS_HOSTNAME
          value: mysql
        - name: RDS_PORT
          value: "3306"
        - name: RDS_DB_NAME
          value: todo
        - name: RDS_USERNAME
          value: todo
        - name: RDS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        - name: RDS_OPTIONS
          value: useSSL=false&allowPublicKeyRetrieval=true
        - name: AUTH
          value: "true"
        - name: HAZELCAST_SERVICE_NAME
          value: todo-hazelcast
        ports:
        - containerPort: 8080
          name: todo
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
